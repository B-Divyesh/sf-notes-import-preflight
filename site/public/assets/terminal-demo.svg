<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title description">
  <title id="title">Notes Preflight sample terminal recording</title>
  <desc id="description">The bundled five-note sample reports three attachments, then finds one changed note and one missing audio attachment.</desc>
  <rect width="1200" height="670" fill="#0b0e12"/>
  <rect width="1200" height="52" fill="#1b222a"/>
  <rect x="20" y="20" width="12" height="12" fill="#ff7c88"/><rect x="42" y="20" width="12" height="12" fill="#ffbf47"/><rect x="64" y="20" width="12" height="12" fill="#56f4c4"/>
  <text x="94" y="32" fill="#b7c1c8" font-family="ui-monospace, monospace" font-size="15">notes-preflight demo · recorded from v0.2.0</text>
  <g font-family="ui-monospace, monospace" font-size="18">
    <text x="38" y="94" fill="#56f4c4">$</text><text x="62" y="94" fill="#f4efe4">notes-preflight demo</text>
    <text x="38" y="134" fill="#ffbf47">DEMO — BUNDLED SAMPLE DATA</text>
    <text x="38" y="178" fill="#f4efe4">PREFLIGHT REPORT</text>
    <text x="38" y="214" fill="#b7c1c8">Notebooks</text><text x="260" y="214" fill="#f4efe4">3</text>
    <text x="38" y="248" fill="#b7c1c8">Notes</text><text x="260" y="248" fill="#f4efe4">5</text>
    <text x="38" y="282" fill="#b7c1c8">Attachments</text><text x="260" y="282" fill="#f4efe4">3 (78 B)</text>
    <text x="38" y="316" fill="#b7c1c8">Links</text><text x="260" y="316" fill="#f4efe4">3 (0 unresolved)</text>
    <text x="38" y="366" fill="#ffbf47">RISKS</text>
    <text x="38" y="400" fill="#f4efe4">Audio recordings ×1 · Table ×1 · Tasks ×1 · Wiki link ×1</text>
    <text x="38" y="452" fill="#ff7c88">MIGRATION CHECK: LOSS FOUND</text>
    <text x="38" y="488" fill="#b7c1c8">Source</text><text x="260" y="488" fill="#f4efe4">5 notes / 3 attachments</text>
    <text x="38" y="522" fill="#b7c1c8">Destination</text><text x="260" y="522" fill="#f4efe4">5 notes / 2 attachments</text>
    <text x="38" y="556" fill="#ff7c88">Missing attachment: interview.m4a</text>
