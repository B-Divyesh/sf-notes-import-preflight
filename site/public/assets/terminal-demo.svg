  <rect x="38" y="625" width="1040" height="4" fill="#34404b"/><rect x="38" y="625" width="1040" height="4" fill="#56f4c4"/>
  <polygon points="1100,616 1100,638 1118,627" fill="#56f4c4"/><text x="1130" y="633" fill="#b7c1c8" font-family="ui-monospace, monospace" font-size="14">00:03</text>
